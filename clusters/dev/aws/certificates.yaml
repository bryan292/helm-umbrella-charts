apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: certificates, namespace: flux-system}
spec:
  dependsOn: [{name: platform}]
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./certificates/dev
  prune: true
  wait: true
  sourceRef: {kind: GitRepository, name: helm-umbrella-charts}
  postBuild:
    substituteFrom: [{kind: ConfigMap, name: cluster-settings}]
