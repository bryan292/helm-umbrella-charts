apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./platform/dev
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: helm-umbrella-charts
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
