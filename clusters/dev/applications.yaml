apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications
  namespace: flux-system
spec:
  dependsOn:
    - name: platform
    - name: certificates
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./applications/dev
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: helm-umbrella-charts
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
