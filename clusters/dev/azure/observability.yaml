apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./observability
  prune: true
  wait: true
  dependsOn:
  - name: platform
  sourceRef:
    kind: GitRepository
    name: helm-umbrella-charts
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
