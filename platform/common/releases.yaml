apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: cert-manager, namespace: flux-system}
spec:
  interval: 10m
  timeout: 10m
  releaseName: cert-manager
  targetNamespace: cert-manager
  install: {createNamespace: true, remediation: {retries: 3}}
  upgrade: {crds: CreateReplace, remediation: {retries: 3}}
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/webhooks/0/clientConfig/caBundle]
        target:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingWebhookConfiguration
          name: cert-manager-webhook
      - paths: [/webhooks/0/clientConfig/caBundle]
        target:
          group: admissionregistration.k8s.io
          version: v1
          kind: MutatingWebhookConfiguration
          name: cert-manager-webhook
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef: {kind: HelmRepository, name: cert-manager, namespace: flux-system}
  values:
    crds: {enabled: true}
    replicaCount: 2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: metrics-server, namespace: flux-system}
spec:
  interval: 10m
  timeout: 10m
  releaseName: metrics-server
  targetNamespace: kube-system
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3}}
  driftDetection: {mode: enabled}
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef: {kind: HelmRepository, name: metrics-server, namespace: flux-system}
  values:
    replicas: 2
    podDisruptionBudget: {enabled: true, minAvailable: 1}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  releaseName: monitoring
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.1.2
      sourceRef:
        kind: HelmRepository
        name: monitoring
        namespace: flux-system
  values:
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    grafana:
      ingress:
        enabled: false
      persistence:
        enabled: true
        storageClassName: ${storage_class}
        size: 10Gi
      service:
        type: ClusterIP
      additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
        editable: false
    prometheus:
      prometheusSpec:
        retention: 35d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ${storage_class}
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 30Gi
        retentionSize: 24GB
        externalLabels:
          cluster: ${cluster_name}
          provider: ${provider}
      ingress:
        enabled: false
      service:
        type: ClusterIP
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ${storage_class}
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
      ingress:
        enabled: false
      service:
        type: ClusterIP
    kube-state-metrics:
      rbac:
        extraRules:
        - apiGroups:
          - kustomize.toolkit.fluxcd.io
          resources:
          - kustomizations
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - helm.toolkit.fluxcd.io
          resources:
          - helmreleases
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - source.toolkit.fluxcd.io
          resources:
          - gitrepositories
          verbs:
          - get
          - list
          - watch
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
            - groupVersionKind:
                group: kustomize.toolkit.fluxcd.io
                version: v1
                kind: Kustomization
              metricNamePrefix: gotk
              labelsFromPath:
                kind:
                - kind
              metrics:
              - name: resource_info
                help: Current Flux resource readiness.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
            - groupVersionKind:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              metricNamePrefix: gotk
              labelsFromPath:
                kind:
                - kind
              metrics:
              - name: resource_info
                help: Current Flux resource readiness.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: GitRepository
              metricNamePrefix: gotk
              labelsFromPath:
                kind:
                - kind
              metrics:
              - name: resource_info
                help: Current Flux resource readiness.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
