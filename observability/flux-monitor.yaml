apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-controllers
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
    - flux-system
  selector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - helm-controller
      - kustomize-controller
      - source-controller
      - notification-controller
      - image-automation-controller
      - image-reflector-controller
  podMetricsEndpoints:
  - port: http-prom
    interval: 30s
